name: Extra

on:
  push:
    branches: [ master ]
    paths-ignore:
    - '.github/workflow/**'
    - '.gitignore'
    - 'AUTHORS'
    - 'COPYING'
    - 'ChangeLog'
    - 'INSTALL'
    - 'NEWS'
    - 'README*'
  # pull_request:
  #   branches: [ master ]
  #   paths-ignore:
  #   - '.github/workflow/**'
  #   - '.gitignore'
  #   - 'AUTHORS'
  #   - 'COPYING'
  #   - 'ChangeLog'
  #   - 'INSTALL'
  #   - 'NEWS'
  #   - 'README*'

jobs:
  arches:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, ppc64le, s390x]
    steps:
    - uses: actions/checkout@v7
    - uses: uraimo/run-on-arch-action@v3
      id: build
      with:
        arch: ${{ matrix.arch }}
        distro: ubuntu_latest
        install: |
          apt-get update -q -y
          apt-get install -q -y build-essential libtool automake
        run: |
          uname -a
          ./autogen.sh
          ./build-linux-binaries.sh
